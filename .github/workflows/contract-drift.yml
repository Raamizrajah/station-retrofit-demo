name: Contract Drift Detection

on:
  pull_request:
    paths:
      - 'backend/Api/specs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-drift:
    name: AI Contract Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Check for spec changes
        id: spec-changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "${BASE_SHA}"...HEAD -- 'backend/Api/specs/*.yaml' || true)
          echo "specs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run contract drift detection
        if: steps.spec-changes.outputs.specs != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            OLD_SPEC=$(git show "${BASE_SHA}:${spec}" 2>/dev/null || echo "")
            if [ -n "$OLD_SPEC" ]; then
              echo "$OLD_SPEC" > /tmp/old-spec.yaml
              python tools/check_contract_drift.py \
                --spec "$spec" \
                --frontend frontend/src \
                --old-spec /tmp/old-spec.yaml \
                > /tmp/drift-report.md 2>&1 || true
            fi
          done <<< "${{ steps.spec-changes.outputs.specs }}"

      - name: Post PR comment
        if: steps.spec-changes.outputs.specs != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/drift-report.md', 'utf8');
            if (body.trim()) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Contract Drift Detection\n\n${body}`
              });
            }
