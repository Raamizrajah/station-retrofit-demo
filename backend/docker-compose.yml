version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: station-retrofit-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: station_retrofit
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
